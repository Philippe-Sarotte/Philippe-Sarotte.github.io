<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="{{ page.description | default: site.description }}"
    >

    <title>
        {% if page.title %}
            {{ page.title }} | {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <link
        rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}"
    >
</head>

<body>

<header class="site-header">
    <div class="container">

        <a
            class="site-title"
            href="{{ '/' | relative_url }}"
        >
            {{ site.author.name }}
        </a>

        <p class="subtitle">
            {{ site.author.position }}
        </p>

        <nav aria-label="Main navigation">

            <a
                href="{{ '/' | relative_url }}"
                {% if page.url == "/" %}
                    class="active"
                {% endif %}
            >
                About me
            </a>

            <a
                href="{{ '/talks/' | relative_url }}"
                {% if page.url == "/talks/" %}
                    class="active"
                {% endif %}
            >
                Talks, Posters & Seminars
            </a>

            <a
                href="{{ '/publications/' | relative_url }}"
                {% if page.url == "/publications/" %}
                    class="active"
                {% endif %}
            >
                Publications & Preprints
            </a>

            <a
                href="{{ '/teaching/' | relative_url }}"
                {% if page.url == "/teaching/" %}
                    class="active"
                {% endif %}
            >
                Teaching
            </a>

        </nav>
    </div>
</header>

<main class="container">
    {{ content }}
</main>

<footer class="site-footer">
    <div class="container">

        <p>
            © {{ "now" | date: "%Y" }}
            {{ site.author.name }}.
        </p>

        <p>
            Built with Jekyll and hosted on GitHub Pages.
        </p>

    </div>
</footer>

</body>
</html>
